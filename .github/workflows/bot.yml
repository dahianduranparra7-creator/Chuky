
name: Bloodline Welcome Bot
# Version 4

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLAN_ID: ${{ secrets.CLAN_ID }}
        run: node bot.js

      - name: Guardar memoria del bot
        run: |
          git config --global user.name "Bloodline Bot"
          git config --global user.email "bot@github.com"
          git add welcomed_users.json initialized.json
          git commit -m "Update bot memory" || echo "No changes"
          git push
